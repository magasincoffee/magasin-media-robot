name: Repair Supervisor Boundary Context V15

on:
  push:
    branches:
      - ops/repair-supervisor-boundary-context-v15
    paths:
      - '.github/workflows/repair-supervisor-boundary-context-v15.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell

    steps:
      - name: Fetch canonical Business OS
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'magasin-business-os-v15'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          git clone --depth 1 https://github.com/magasincoffee/magasincoffee.github.io.git $dest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUSINESS_OS_REPO=$dest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Repair Supervisor v15
        run: |
          $repair = Join-Path $env:BUSINESS_OS_REPO '08_INTEGRATIONS\supervisor\windows\repair-supervisor.ps1'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $repair -SkipGitPull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify live boundary context and diagnostics
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $cli = Join-Path $root 'runtime\src\runtime\supervisor-loop-cli.mjs'
          $statusFile = Join-Path $root 'runtime-status.json'
          $latest = Join-Path $root 'diagnostics\latest.json'
          $incidents = Join-Path $root 'diagnostics\incidents.ndjson'
          $log = Join-Path $root 'supervisor.log'

          if (-not (Select-String -Path $cli -SimpleMatch '2026-09-18.15' -Quiet)) {
            throw 'Runtime v15 fingerprint missing.'
          }

          Start-Sleep -Seconds 20

          $status = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "STATUS_SCHEMA=$($status.schema_version)"
          Write-Host "PROJECT_STATUS=$($status.project_status)"
          Write-Host "CURRENT_TASK=$($status.current_task)"
          Write-Host "OWNER_PENDING_COUNT=$(@($status.owner_boundary_pending).Count)"
          Write-Host "ACTIVATION_REASON=$($status.activation_boundary_reason)"
          Write-Host "ACTIVATION_PENDING=$(@($status.activation_boundary_pending) -join ',')"

          if ($status.schema_version -ne 2) { throw 'Runtime status schema v2 missing.' }
          if ($status.current_task -ne 'TASK-035') { throw 'Unexpected current task.' }
          if ($status.project_status -ne 'WAIT_USER') { throw 'Expected TASK-035 activation WAIT_USER.' }
          if (@($status.owner_boundary_pending).Count -ne 0) {
            throw 'Owner decision boundary should already be resolved.'
          }
          if (@($status.activation_boundary_pending).Count -lt 1) {
            throw 'Activation boundary metadata missing.'
          }

          if (-not (Test-Path $latest)) { throw 'Diagnostic latest.json missing.' }
          $d = Get-Content $latest -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "DIAG_RUNTIME=$($d.runtime_version)"
          Write-Host "DIAG_ACTIVATION_REASON=$($d.project.activation_boundary_reason)"
          Write-Host "DIAG_ACTIVATION_PENDING_COUNT=$(@($d.project.activation_boundary_pending).Count)"
          if (@($d.project.activation_boundary_pending).Count -lt 1) {
            throw 'Diagnostic boundary context missing.'
          }

          $bootLine = Get-Content $log -Tail 260 -Encoding UTF8 |
            Where-Object { $_ -match '"type":"RUNTIME_BOOT"' -and $_ -match 'version=2026-09-18.15' } |
            Select-Object -Last 1
          if (-not $bootLine) { throw 'v15 boot marker missing.' }
          $bootAt = [DateTimeOffset]::Parse(($bootLine | ConvertFrom-Json).timestamp)

          if (Test-Path $incidents) {
            $newFalseIncidents = @(
              Get-Content $incidents -Tail 30 -Encoding UTF8 |
                ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } |
                Where-Object {
                  $_ -and
                  $_.kind -eq 'WAIT_USER_RECONCILE_STALL' -and
                  ([DateTimeOffset]::Parse($_.timestamp) -ge $bootAt)
                }
            )
            Write-Host "NEW_FALSE_WAIT_INCIDENTS=$($newFalseIncidents.Count)"
            if ($newFalseIncidents.Count -gt 0) {
              throw 'Valid activation WAIT_USER still creates a false incident.'
            }
          }

          Write-Host 'FIELD_BOUNDARY_CONTEXT_V15=PASS'

      - name: Print safe diagnostics
        run: |
          $collector = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor\runtime\windows\collect-supervisor-diagnostics.ps1'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $collector
