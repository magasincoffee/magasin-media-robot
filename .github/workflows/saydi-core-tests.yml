name: SAYDI Core Tests

on:
  pull_request:
    paths:
      - "02_SAYDI_CORE/**"
      - ".github/workflows/saydi-core-tests.yml"
      - "tools/saydi_tts/qc/**"
      - "tools/saydi_tts/qc/**"
  push:
    branches:
      - main
    paths:
      - "02_SAYDI_CORE/**"
      - ".github/workflows/saydi-core-tests.yml"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\02_SAYDI_CORE\src"
          python -m compileall -q 02_SAYDI_CORE\src 02_SAYDI_CORE\tests
          python -m py_compile tools\saydi_tts\qc\run_qc.py

      - name: PowerShell field harness syntax
        shell: powershell
        run: |
          $paths = @(
            "tools\saydi_tts\qc\INSTALL_QC006_FIELD_H4A16IL.ps1",
            "tools\saydi_tts\qc\RESUME_QC006_POST_REPAIR_H4A16IL.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path :: $($_.Message)" }
              throw "QC006 PowerShell syntax failed: $path"
            }
          }

      - name: QC installer dependency closure
        shell: powershell
        run: |
          $scripts = Get-ChildItem "tools\saydi_tts\qc" -Filter "*.ps1" -File
          foreach ($script in $scripts) {
            $content = Get-Content $script.FullName -Raw
            if ($content -match "prosody\.py" -and $content -notmatch "contracts\.py") {
              throw "$($script.Name) installs prosody.py without contracts.py"
            }
          }

      - name: Unit tests
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\02_SAYDI_CORE\src"
          python -m unittest discover -s 02_SAYDI_CORE\tests -v

      - name: Offline runner smoke
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\02_SAYDI_CORE\src"
          $run = Join-Path $env:RUNNER_TEMP "saydi-core-smoke"
          python -m saydi_audiobook prepare --input 02_SAYDI_CORE\fixtures\business_sample_vi.txt --run-dir $run --analysis rules
          python -m saydi_audiobook decide-text --run-dir $run --decision approve
          if (-not (Test-Path (Join-Path $run "book_profile.json"))) { throw "book_profile.json missing" }
          if (-not (Test-Path (Join-Path $run "text_preview.json"))) { throw "text_preview.json missing" }
