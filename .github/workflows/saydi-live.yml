name: SaydiVoice D4 One-Shot Download Discovery

on:
  push:
    branches:
      - ops/saydi-d4-one-shot-20260917

permissions:
  contents: read

concurrency:
  group: saydi-d4-one-shot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  d4-one-shot:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: 01_DISCOVERY/saydivoice
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Resolve installed Python
        run: |
          $python = $null
          $py = Get-Command py.exe -ErrorAction SilentlyContinue
          if ($py) {
            $candidate = (& $py.Source -3 -c "import sys; print(sys.executable)").Trim()
            if ($LASTEXITCODE -eq 0 -and (Test-Path $candidate)) { $python = $candidate }
          }
          if (-not $python) {
            $cmd = Get-Command python.exe -ErrorAction SilentlyContinue
            if ($cmd) { $python = $cmd.Source }
          }
          if (-not $python -or -not (Test-Path $python)) {
            throw "Installed Python 3 was not found on the self-hosted runner."
          }
          "SAYDI_SYSTEM_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create isolated D4 environment
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "saydi-d4-one-shot-venv"
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & "$env:SAYDI_SYSTEM_PYTHON" -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venvPython = Join-Path $venv "Scripts\python.exe"
          & $venvPython -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPython -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPython -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SAYDI_PYTHON=$venvPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve installed Google Chrome
        run: |
          $chrome = Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) {
            $chrome = Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe"
          }
          if (-not (Test-Path $chrome)) {
            throw "Installed Google Chrome was not found on the self-hosted runner."
          }
          "SAYDI_CHROME=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify persistent Saydi profile exists and is unlocked
        run: |
          $profile = Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\browser_profile"
          if (-not (Test-Path $profile)) { throw "Saydi browser profile is missing." }
          $items = @(Get-ChildItem $profile -Force -ErrorAction SilentlyContinue)
          if ($items.Count -eq 0) { throw "Saydi browser profile exists but is empty." }
          $holders = @(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" | Where-Object { $_.CommandLine -like "*MAGASIN\MediaRobot\saydivoice\browser_profile*" })
          if ($holders.Count -gt 0) { throw "Saydi robot browser profile is currently open in Chrome." }
          Write-Host "Persistent authenticated profile found and unlocked."

      - name: Run exactly one authenticated D4 generation plus download
        run: |
          Write-Host "AUTHORIZED D4: exactly one Generate and one Download; audio is hashed then deleted locally."
          & "$env:SAYDI_PYTHON" -m saydivoice_discovery.d4_download --chromium-executable "$env:SAYDI_CHROME" --allow-generate --allow-download --generation-timeout-ms 60000 --generation-poll-ms 500 --download-timeout-ms 15000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify no temporary audio remains in D4 evidence
        run: |
          $d4 = Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\runs\d4_latest"
          if (-not (Test-Path (Join-Path $d4 "d4_download.json"))) { throw "D4 evidence JSON missing." }
          $audio = @(Get-ChildItem $d4 -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.mp3','.wav','.flac','.ogg','.bin') })
          if ($audio.Count -gt 0) { throw "D4 left an audio/binary file in evidence; refusing artifact upload." }
          Write-Host "No audio/binary payload retained in D4 evidence."

      - name: Stage privacy-safe D4 evidence
        if: always()
        run: |
          $src = Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\runs\d4_latest"
          $out = Join-Path $env:RUNNER_TEMP "saydi-d4-one-shot-evidence"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null
          if (Test-Path $src) { Copy-Item (Join-Path $src '*') $out -Recurse -Force }

      - name: Upload D4 metadata/screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saydi-d4-one-shot-${{ github.run_id }}
          path: ${{ runner.temp }}\saydi-d4-one-shot-evidence
          if-no-files-found: warn
          retention-days: 7
