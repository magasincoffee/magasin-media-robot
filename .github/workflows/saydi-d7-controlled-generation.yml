name: SaydiVoice D7 Controlled Generation

on:
  push:
    branches:
      - d7/controlled-generation-20260917

permissions:
  contents: read

concurrency:
  group: saydi-d7-controlled-${{ github.repository }}
  cancel-in-progress: false

jobs:
  d7-controlled-generation:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: 01_DISCOVERY/saydivoice
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Resolve installed Python
        run: |
          $python=$null
          $py=Get-Command py.exe -ErrorAction SilentlyContinue
          if($py){$candidate=(& $py.Source -3 -c "import sys; print(sys.executable)").Trim(); if($LASTEXITCODE -eq 0 -and (Test-Path $candidate)){$python=$candidate}}
          if(-not $python){$cmd=Get-Command python.exe -ErrorAction SilentlyContinue; if($cmd){$python=$cmd.Source}}
          if(-not $python){throw "Python not found"}
          "SAYDI_SYSTEM_PYTHON=$python" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build isolated environment
        run: |
          $v=Join-Path $env:RUNNER_TEMP "saydi-d7-venv"
          if(Test-Path $v){Remove-Item $v -Recurse -Force}
          & "$env:SAYDI_SYSTEM_PYTHON" -m venv $v
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $p=Join-Path $v "Scripts\python.exe"
          & $p -m pip install -q -r requirements-dev.txt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $p -m pip install -q -e .
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          "SAYDI_PYTHON=$p" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile D7 before any live action
        run: |
          & "$env:SAYDI_PYTHON" -m py_compile src\saydivoice_discovery\d7_controlled_generation.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Resolve Chrome and unlocked authenticated profile
        run: |
          $chrome=Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"
          if(-not(Test-Path $chrome)){$chrome=Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe"}
          if(-not(Test-Path $chrome)){throw "Chrome not found"}
          $profile=Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\browser_profile"
          if(-not(Test-Path $profile)){throw "Saydi profile missing"}
          $holders=@(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" | Where-Object {$_.CommandLine -like "*MAGASIN\MediaRobot\saydivoice\browser_profile*"})
          if($holders.Count -gt 0){throw "Saydi profile is locked"}
          "SAYDI_CHROME=$chrome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run exactly one authorized controlled Generate
        run: |
          & "$env:SAYDI_PYTHON" -m saydivoice_discovery.d7_controlled_generation --chromium-executable "$env:SAYDI_CHROME" --generation-timeout-ms 90000
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Stage privacy-safe D7 evidence
        if: always()
        run: |
          $src=Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\runs\d7_latest"
          $out=Join-Path $env:RUNNER_TEMP "saydi-d7-evidence"
          if(Test-Path $out){Remove-Item $out -Recurse -Force}
          New-Item -ItemType Directory -Path $out | Out-Null
          if(Test-Path $src){Get-ChildItem $src -File | Where-Object {$_.Extension -in @('.json','.png')} | ForEach-Object {Copy-Item $_.FullName $out -Force}}

      - name: Upload D7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saydi-d7-${{ github.run_id }}
          path: ${{ runner.temp }}\saydi-d7-evidence
          retention-days: 7
          if-no-files-found: warn
