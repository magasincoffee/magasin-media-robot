name: SaydiVoice D3 One-Shot Generation

on:
  push:
    branches:
      - d3/one-shot-20260917-1930

permissions:
  contents: read

concurrency:
  group: saydi-d3-one-shot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  d3-one-shot:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: 01_DISCOVERY/saydivoice
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Resolve installed Python
        run: |
          $python = $null
          $py = Get-Command py.exe -ErrorAction SilentlyContinue
          if ($py) {
            $candidate = (& $py.Source -3 -c "import sys; print(sys.executable)").Trim()
            if ($LASTEXITCODE -eq 0 -and (Test-Path $candidate)) { $python = $candidate }
          }
          if (-not $python) {
            $cmd = Get-Command python.exe -ErrorAction SilentlyContinue
            if ($cmd) { $python = $cmd.Source }
          }
          if (-not $python -or -not (Test-Path $python)) {
            throw "Installed Python 3 was not found on the self-hosted runner."
          }
          "SAYDI_SYSTEM_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using installed Python: $python"

      - name: Create isolated D3 environment
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "saydi-d3-one-shot-venv"
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          & "$env:SAYDI_SYSTEM_PYTHON" -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venvPython = Join-Path $venv "Scripts\python.exe"
          & $venvPython -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPython -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPython -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SAYDI_PYTHON=$venvPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve installed Google Chrome
        run: |
          $chrome = Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) {
            $chrome = Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe"
          }
          if (-not (Test-Path $chrome)) {
            throw "Installed Google Chrome was not found on the self-hosted runner."
          }
          "SAYDI_CHROME=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using installed Google Chrome: $chrome"

      - name: Verify authenticated profile exists and is unlocked
        run: |
          $profile = Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\browser_profile"
          if (-not (Test-Path $profile)) { throw "Saydi browser profile is missing." }
          $holders = @(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" | Where-Object { $_.CommandLine -like "*MAGASIN\MediaRobot\saydivoice\browser_profile*" })
          if ($holders.Count -gt 0) { throw "Saydi robot profile is currently open in Chrome." }
          Write-Host "Saydi profile exists and is unlocked."

      - name: Run exactly one authorized D3 Generate attempt
        run: |
          & "$env:SAYDI_PYTHON" -m saydivoice_discovery.cli --chromium-executable "$env:SAYDI_CHROME" --timeout-ms 60000 --settle-ms 2500 --allow-generate --generation-timeout-ms 60000 --generation-poll-ms 500
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Evaluate D3 success signal
        run: |
          & "$env:SAYDI_PYTHON" -m saydivoice_discovery.ci_gate --require-generation-success
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect privacy-safe D3 evidence
        if: always()
        run: |
          $root = Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice"
          $out = Join-Path $env:RUNNER_TEMP "saydi-d3-one-shot-evidence"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null

          $latestRun = Get-ChildItem (Join-Path $root "runs") -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latestRun) { Copy-Item $latestRun.FullName (Join-Path $out "run") -Recurse -Force }

          $latestReport = Get-ChildItem (Join-Path $root "reports\discovery_report_*.json") -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latestReport) { Copy-Item $latestReport.FullName $out -Force }

          $latestLog = Get-ChildItem (Join-Path $root "logs\discovery_*.jsonl") -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latestLog) { Copy-Item $latestLog.FullName $out -Force }

          Write-Host "D3 evidence staged without browser_profile."

      - name: Upload D3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saydi-d3-one-shot-${{ github.run_id }}
          path: ${{ runner.temp }}\saydi-d3-one-shot-evidence
          if-no-files-found: warn
          retention-days: 7
