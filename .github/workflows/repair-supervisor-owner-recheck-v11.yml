name: Repair Supervisor Owner Recheck V11

on:
  push:
    branches:
      - ops/repair-supervisor-owner-recheck-v11
    paths:
      - '.github/workflows/repair-supervisor-owner-recheck-v11.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell

    steps:
      - name: Fetch canonical Business OS
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'magasin-business-os-v11'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          git clone --depth 1 https://github.com/magasincoffee/magasincoffee.github.io.git $dest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUSINESS_OS_REPO=$dest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Repair Supervisor v11
        run: |
          $repair = Join-Path $env:BUSINESS_OS_REPO '08_INTEGRATIONS\supervisor\windows\repair-supervisor.ps1'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $repair -SkipGitPull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed v11 and Owner recheck control
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $runtime = Join-Path $root 'runtime'
          $cli = Join-Path $runtime 'src\runtime\supervisor-loop-cli.mjs'
          $panel = Join-Path $runtime 'windows\control-panel.ps1'

          if (-not (Select-String -Path $cli -SimpleMatch '2026-09-18.11' -Quiet)) {
            throw 'Runtime v11 fingerprint missing.'
          }
          if (-not (Select-String -Path $panel -SimpleMatch 'OWNER_RESOLVED.request.json' -Quiet)) {
            throw 'Owner recheck control marker missing.'
          }
          if (-not (Select-String -Path $cli -SimpleMatch 'OWNER_RESOLVED.request.json' -Quiet)) {
            throw 'Owner recheck marker path missing.'
          }
          if (-not (Select-String -Path $cli -SimpleMatch 'ownerReconcileActive' -Quiet)) {
            throw 'Active owner reconciliation state missing.'
          }

          Write-Host 'RUNTIME_V11_FINGERPRINT=PASS'

      - name: Verify singleton
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $wrappers = @(
            Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -and
                $_.CommandLine -like '*run-supervisor.ps1*' -and
                $_.CommandLine -like "*$root*"
              }
          )
          $nodes = @(
            Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like '*supervisor-loop-cli.mjs*' }
          )

          Write-Host "WRAPPER_COUNT=$($wrappers.Count)"
          Write-Host "NODE_LOOP_COUNT=$($nodes.Count)"
          if ($wrappers.Count -ne 1 -or $nodes.Count -ne 1) {
            throw "Supervisor singleton failed: wrappers=$($wrappers.Count), nodes=$($nodes.Count)"
          }

          Write-Host 'FIELD_VERIFICATION_V11=PASS'
