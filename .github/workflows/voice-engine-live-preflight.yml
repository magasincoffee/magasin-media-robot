name: Voice Engine Live Preflight

on:
  push:
    branches:
      - feat/saydi-production-provider
    paths:
      - '02_VOICE_ENGINE/**'
      - '.github/workflows/voice-engine-live-preflight.yml'

permissions:
  contents: read

concurrency:
  group: voice-engine-live-preflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  live-preflight:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: 02_VOICE_ENGINE
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Resolve installed Python and unlocked Saydi profile
        run: |
          $python=$null
          $py=Get-Command py.exe -ErrorAction SilentlyContinue
          if($py){$candidate=(& $py.Source -3 -c "import sys; print(sys.executable)").Trim(); if($LASTEXITCODE -eq 0 -and (Test-Path $candidate)){$python=$candidate}}
          if(-not $python){$cmd=Get-Command python.exe -ErrorAction SilentlyContinue; if($cmd){$python=$cmd.Source}}
          if(-not $python){throw "Python not found"}
          $profile=Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\browser_profile"
          if(-not(Test-Path $profile)){throw "Saydi profile missing"}
          $holders=@(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" | Where-Object {$_.CommandLine -like "*MAGASIN\MediaRobot\saydivoice\browser_profile*"})
          if($holders.Count -gt 0){throw "Saydi profile is locked"}
          "VOICE_SYSTEM_PYTHON=$python" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build isolated voice engine environment
        run: |
          $v=Join-Path $env:RUNNER_TEMP "voice-engine-live-preflight-venv"
          if(Test-Path $v){Remove-Item $v -Recurse -Force}
          & "$env:VOICE_SYSTEM_PYTHON" -m venv $v
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $p=Join-Path $v "Scripts\python.exe"
          & $p -m pip install -q -e .
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          "VOICE_PYTHON=$p" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run read-only production backend preflight
        run: |
          @'
          import json
          from dataclasses import asdict
          from magasin_voice_engine.saydi_playwright import SaydiPlaywrightBackend

          backend = SaydiPlaywrightBackend()
          try:
              result = backend.preflight()
              payload = asdict(result)
              if payload.get("disposition") is not None:
                  payload["disposition"] = payload["disposition"].value
              print(json.dumps(payload, ensure_ascii=True, indent=2))
              if not result.ready:
                  raise SystemExit(25)
          finally:
              backend.close()
          '@ | & "$env:VOICE_PYTHON" -
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Assert no side-effect artifacts are produced
        run: |
          Write-Host "PASS: workflow contains no Generate or Download operation; only production preflight was executed."
