name: SAYDI Local Audible Sample

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/saydi-local-trigger.txt"

permissions:
  contents: read

concurrency:
  group: saydi-local-audible-sample
  cancel-in-progress: false

jobs:
  local-sample:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build synthetic MP3 transfer sample
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "02_SAYDI_CORE\scripts\ci_export_mp3.ps1"

      - name: Upload synthetic MP3 transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: saydi-synthetic-mp3
          path: ${{ github.workspace }}\SAYDI_SAMPLE.mp3
          if-no-files-found: error
          retention-days: 1
