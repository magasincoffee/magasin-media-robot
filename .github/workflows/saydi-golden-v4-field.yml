name: SAYDI Golden Story V4 Field Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/saydi-v4-trigger.txt"

permissions:
  contents: read

concurrency:
  group: saydi-golden-v4-field
  cancel-in-progress: false

jobs:
  build-v4:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build Golden Story V4 on H4A16IL
        shell: powershell
        run: |
          & "$PWD\tools\saydi_tts\narration\BUILD_GOLDEN_STORY_V4_H4A16IL.ps1" -WaitMinutes 45 -NoOpen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect listener artifact
        shell: powershell
        run: |
          $final = Get-ChildItem "C:\SAYDI\output" -Filter "SAYDI_STORY_GOLDEN_V4_FINAL.mp3" -File -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $final) { throw "Golden Story V4 final MP3 not found." }

          $report = Get-ChildItem $final.Directory.FullName -Filter "SAYDI_STORY_GOLDEN_V4_REPORT.json" -File |
            Select-Object -First 1
          if (-not $report) { throw "Golden Story V4 report not found." }

          $out = Join-Path $env:RUNNER_TEMP "saydi-golden-v4"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item $final.FullName (Join-Path $out $final.Name)
          Copy-Item $report.FullName (Join-Path $out $report.Name)
          "SAYDI_V4_ARTIFACT_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Golden Story V4
        uses: actions/upload-artifact@v4
        with:
          name: saydi-golden-story-v4
          path: ${{ env.SAYDI_V4_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
