name: SAYDI Local Audible Sample

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/saydi-local-trigger.txt"

permissions:
  contents: read

concurrency:
  group: saydi-local-audible-sample
  cancel-in-progress: false

jobs:
  local-sample:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Python
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $python = $null
          $py = Get-Command py.exe -ErrorAction SilentlyContinue
          if ($py) {
            $candidate = (& $py.Source -3 -c "import sys; print(sys.executable)").Trim()
            if ($LASTEXITCODE -eq 0 -and (Test-Path $candidate)) { $python = $candidate }
          }
          if (-not $python) {
            $cmd = Get-Command python.exe -ErrorAction SilentlyContinue
            if ($cmd) { $python = $cmd.Source }
          }
          if (-not $python) { throw "Python 3 not found." }
          "SAYDI_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run offline core tests
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $env:PYTHONPATH = "$PWD\02_SAYDI_CORE\src"
          & "$env:SAYDI_PYTHON" -m compileall -q 02_SAYDI_CORE\src 02_SAYDI_CORE\tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SAYDI_PYTHON" -m unittest discover -s 02_SAYDI_CORE\tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare and approve synthetic text sample
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $env:PYTHONPATH = "$PWD\02_SAYDI_CORE\src"
          $workRoot = Split-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) -Parent
          $root = Join-Path $workRoot "SAYDI_RUNTIME"
          $run = Join-Path $root "runs\github-${{ github.run_id }}"
          New-Item -ItemType Directory -Force -Path $run | Out-Null
          Write-Host "SAYDI runtime root: $root"
          Write-Host "SAYDI run dir: $run"
          & "$env:SAYDI_PYTHON" -m saydi_audiobook prepare --input 02_SAYDI_CORE\fixtures\business_sample_vi.txt --run-dir $run --analysis rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SAYDI_PYTHON" -m saydi_audiobook decide-text --run-dir $run --decision approve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SAYDI_RUN_DIR=$run" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate local Windows SAPI audible sample
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $env:PYTHONPATH = "$PWD\02_SAYDI_CORE\src"
          & "$env:SAYDI_PYTHON" -m saydi_audiobook synthesize-sample --run-dir "$env:SAYDI_RUN_DIR" --provider windows-sapi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $audioDir = Join-Path $env:SAYDI_RUN_DIR "audio"
          $audioFiles = @(Get-ChildItem $audioDir -File -ErrorAction Stop)
          if ($audioFiles.Count -eq 0) { throw "No audio file was produced." }

          $workRoot = Split-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) -Parent
          $latestDir = Join-Path $workRoot "SAYDI_OUTPUT"
          New-Item -ItemType Directory -Force -Path $latestDir | Out-Null

          foreach ($file in $audioFiles) {
            Copy-Item $file.FullName (Join-Path $latestDir $file.Name) -Force
          }

          $latestSample = Join-Path $latestDir "latest-sample.wav"
          Copy-Item $audioFiles[0].FullName $latestSample -Force

          Write-Host "Audio sample remains local."
          Write-Host "Run audio directory: $audioDir"
          Write-Host "Easy-open copy: $latestSample"
          if (-not (Test-Path $latestSample)) { throw "latest-sample.wav was not persisted." }
          $hash = (Get-FileHash $latestSample -Algorithm SHA256).Hash
          $info = Get-Item $latestSample
          $locationFile = Join-Path $latestDir "LOCATION.txt"
          Set-Content -Path $locationFile -Value $info.FullName -Encoding UTF8
          Write-Host "SAYDI_WORK_ROOT=$workRoot"
          Write-Host "SAYDI_OUTPUT_FILE=$($info.FullName)"
          Write-Host "SAYDI_OUTPUT_BYTES=$($info.Length)"
          Write-Host "SAYDI_OUTPUT_SHA256=$hash"
          Get-ChildItem $latestDir -File | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize
          Start-Process explorer.exe -ArgumentList $latestDir
          Write-Host "Opened local output folder in Explorer."
          Write-Host "No audio or manuscript text is uploaded as an Actions artifact."
