name: Discovery Tests

on:
  push:
    paths:
      - "01_DISCOVERY/saydivoice/**"
      - ".github/workflows/discovery-tests.yml"
  pull_request:
    paths:
      - "01_DISCOVERY/saydivoice/**"
      - ".github/workflows/discovery-tests.yml"

jobs:
  unit-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 01_DISCOVERY/saydivoice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile package
        run: python -m compileall -q src
      - name: Run unit tests
        run: python -m pytest
      - name: Build operator ZIP
        if: success()
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $stage = Join-Path $env:RUNNER_TEMP "MAGASIN_SAYDIVOICE_DISCOVERY_V0.3.1"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Get-ChildItem $root -Force | Where-Object { $_.Name -notin @('.venv','__pycache__','.pytest_cache') } | ForEach-Object {
            Copy-Item $_.FullName -Destination $stage -Recurse -Force
          }
          Get-ChildItem $stage -Recurse -Directory -Force | Where-Object { $_.Name -in @('__pycache__','.pytest_cache') } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $zip = Join-Path $env:RUNNER_TEMP "MAGASIN_SAYDIVOICE_DISCOVERY_V0.3.1.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          Copy-Item $zip -Destination (Join-Path $root 'MAGASIN_SAYDIVOICE_DISCOVERY_V0.3.1.zip') -Force
      - name: Upload operator ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAGASIN_SAYDIVOICE_DISCOVERY_V0.3.1
          path: 01_DISCOVERY/saydivoice/MAGASIN_SAYDIVOICE_DISCOVERY_V0.3.1.zip
          if-no-files-found: error
          retention-days: 7
