name: Repair Supervisor Diagnostics V15

on:
  push:
    branches:
      - ops/repair-supervisor-diagnostics-v15
    paths:
      - '.github/workflows/repair-supervisor-diagnostics-v15.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell
    steps:
      - name: Fetch latest Business OS
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'magasin-business-os-v15'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          git clone --depth 1 https://github.com/magasincoffee/magasincoffee.github.io.git $dest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUSINESS_OS_REPO=$dest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Repair Supervisor v15
        run: |
          $repair = Join-Path $env:BUSINESS_OS_REPO '08_INTEGRATIONS\supervisor\windows\repair-supervisor.ps1'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $repair -SkipGitPull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify diagnostics installation
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $runtime = Join-Path $root 'runtime'
          $cli = Join-Path $runtime 'src\runtime\supervisor-loop-cli.mjs'
          $diag = Join-Path $runtime 'src\runtime\diagnostics.mjs'
          $panel = Join-Path $runtime 'windows\control-panel.ps1'
          $collector = Join-Path $runtime 'windows\collect-supervisor-diagnostics.ps1'

          if (-not (Select-String -Path $cli -SimpleMatch '2026-09-18.15' -Quiet)) { throw 'Runtime v15 missing.' }
          if (-not (Test-Path $diag)) { throw 'diagnostics.mjs missing.' }
          if (-not (Test-Path $collector)) { throw 'diagnostic collector missing.' }
          if (-not (Select-String -Path $panel -SimpleMatch 'MỞ LOG LỖI' -Quiet)) { throw 'Diagnostics button missing.' }

          $diagnosticsRoot = Join-Path $root 'diagnostics'
          for ($i = 0; $i -lt 10; $i++) {
            if (Test-Path (Join-Path $diagnosticsRoot 'latest.json')) { break }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path (Join-Path $diagnosticsRoot 'latest.json'))) {
            throw 'diagnostics/latest.json was not produced.'
          }

          Write-Host "DIAGNOSTICS_PATH=$diagnosticsRoot"
          Write-Host 'DIAGNOSTICS_INSTALL=PASS'

      - name: Print privacy-safe latest diagnostics
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $collector = Join-Path $root 'runtime\windows\collect-supervisor-diagnostics.ps1'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $collector

      - name: Verify singleton
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $wrappers = @(
            Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like '*run-supervisor.ps1*' -and $_.CommandLine -like "*$root*" }
          )
          $nodes = @(
            Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like '*supervisor-loop-cli.mjs*' }
          )
          Write-Host "WRAPPER_COUNT=$($wrappers.Count)"
          Write-Host "NODE_LOOP_COUNT=$($nodes.Count)"
          if ($wrappers.Count -ne 1 -or $nodes.Count -ne 1) { throw 'Supervisor singleton verification failed.' }
          Write-Host 'FIELD_VERIFICATION_V15=PASS'
