name: Voice Engine Live Preflight

on:
  push:
    branches:
      - feat/saydi-production-provider
    paths:
      - '02_VOICE_ENGINE/**'
      - '.github/workflows/voice-engine-live-preflight.yml'

permissions:
  contents: read

concurrency:
  group: voice-engine-live-preflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  live-preflight:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: 02_VOICE_ENGINE
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Resolve installed Python and unlocked Saydi profile
        run: |
          $python=$null
          $py=Get-Command py.exe -ErrorAction SilentlyContinue
          if($py){$candidate=(& $py.Source -3 -c "import sys; print(sys.executable)").Trim(); if($LASTEXITCODE -eq 0 -and (Test-Path $candidate)){$python=$candidate}}
          if(-not $python){$cmd=Get-Command python.exe -ErrorAction SilentlyContinue; if($cmd){$python=$cmd.Source}}
          if(-not $python){throw "Python not found"}
          $profile=Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\browser_profile"
          if(-not(Test-Path $profile)){throw "Saydi profile missing"}
          $holders=@(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" | Where-Object {$_.CommandLine -like "*MAGASIN\MediaRobot\saydivoice\browser_profile*"})
          if($holders.Count -gt 0){throw "Saydi profile is locked"}
          "VOICE_SYSTEM_PYTHON=$python" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build isolated voice engine environment
        run: |
          $v=Join-Path $env:RUNNER_TEMP "voice-engine-live-preflight-venv"
          if(Test-Path $v){Remove-Item $v -Recurse -Force}
          & "$env:VOICE_SYSTEM_PYTHON" -m venv $v
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $p=Join-Path $v "Scripts\python.exe"
          & $p -m pip install -q -e .
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          "VOICE_PYTHON=$p" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run read-only production backend preflight
        run: |
          @'
          import json
          from dataclasses import asdict
          from magasin_voice_engine.models import FailureDisposition
          from magasin_voice_engine.saydi_playwright import SaydiPlaywrightBackend
          from magasin_voice_engine.supervisor_status import (
              HeartbeatWorker,
              RobotStatus,
              SupervisorStateStore,
              default_job_id,
          )

          backend = SaydiPlaywrightBackend()
          store = SupervisorStateStore()
          job_id = default_job_id()
          heartbeat = HeartbeatWorker(store, interval_seconds=30).start()
          store.publish(
              RobotStatus.RUNNING,
              job_id=job_id,
              current_step="production_preflight",
              next_action="Verify the authenticated production backend without Generate or Download.",
              requires_user=False,
              message="Read-only production preflight is running.",
          )
          try:
              result = backend.preflight()
              payload = asdict(result)
              if payload.get("disposition") is not None:
                  payload["disposition"] = payload["disposition"].value
              print(json.dumps(payload, ensure_ascii=True, indent=2))
              if result.ready:
                  store.publish(
                      RobotStatus.DONE,
                      job_id=job_id,
                      current_step="complete",
                      last_completed_step="production_preflight",
                      requires_user=False,
                      message="Read-only production preflight passed.",
                  )
              else:
                  needs_user = result.disposition in {
                      FailureDisposition.RE_AUTH,
                      FailureDisposition.FIX_INPUT,
                  }
                  store.publish(
                      RobotStatus.WAIT_USER if needs_user else RobotStatus.FAILED,
                      job_id=job_id,
                      current_step="wait_user" if needs_user else "failed",
                      last_completed_step=None,
                      next_action="Resolve the preflight requirement, then rerun." if needs_user else "Inspect the preflight failure.",
                      requires_user=True,
                      message="PREFLIGHT_FAILED",
                  )
                  raise SystemExit(25)
          except BaseException:
              state = store.load()
              if state.status == RobotStatus.RUNNING.value:
                  store.publish(
                      RobotStatus.FAILED,
                      job_id=job_id,
                      current_step="failed",
                      next_action="Inspect the read-only preflight failure.",
                      requires_user=True,
                      message="PREFLIGHT_EXCEPTION",
                  )
              raise
          finally:
              heartbeat.stop()
              backend.close()
          '@ | & "$env:VOICE_PYTHON" -
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Assert no side-effect artifacts are produced
        run: |
          Write-Host "PASS: workflow contains no Generate or Download operation; only production preflight was executed."
