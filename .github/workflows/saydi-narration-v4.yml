name: SAYDI Narration V4 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/saydi-narration-v4-trigger.txt"

permissions:
  contents: read

concurrency:
  group: saydi-narration-v4-build
  cancel-in-progress: false

jobs:
  build-v4:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Build Golden Story V4 on SAYDI runner
        shell: powershell
        run: |
          & "$PWD\tools\saydi_tts\narration\BUILD_GOLDEN_STORY_V4_H4A16IL.ps1" -WaitMinutes 50
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate V4 outputs
        shell: powershell
        run: |
          $mp3 = Get-ChildItem "C:\SAYDI\output" -Recurse -Filter "SAYDI_STORY_GOLDEN_V4_FINAL.mp3" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $report = Get-ChildItem "C:\SAYDI\output" -Recurse -Filter "SAYDI_STORY_GOLDEN_V4_REPORT.json" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $mp3) { throw "V4 final MP3 not found" }
          if (-not $report) { throw "V4 report not found" }
          $stage = Join-Path $env:RUNNER_TEMP "saydi-v4-final"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item $mp3.FullName (Join-Path $stage $mp3.Name) -Force
          Copy-Item $report.FullName (Join-Path $stage $report.Name) -Force
          Write-Host "Final MP3: $($mp3.FullName)"
          Write-Host "Report: $($report.FullName)"

      - name: Upload Golden Story V4
        uses: actions/upload-artifact@v4
        with:
          name: saydi-golden-story-v4
          path: ${{ runner.temp }}\saydi-v4-final
          if-no-files-found: error
          retention-days: 7
