name: Install MAGASIN Supervisor Controls

on:
  push:
    branches:
      - feat/saydi-production-provider
    paths:
      - '.github/workflows/install-magasin-supervisor-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-magasin-supervisor-controls
  cancel-in-progress: false

jobs:
  install-controls:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Python and initialize local dashboard
        shell: powershell
        run: |
          $python=$null
          $py=Get-Command py.exe -ErrorAction SilentlyContinue
          if($py){
            $candidate=(& $py.Source -3 -c "import sys; print(sys.executable)").Trim()
            if($LASTEXITCODE -eq 0 -and (Test-Path $candidate)){$python=$candidate}
          }
          if(-not $python){
            $cmd=Get-Command python.exe -ErrorAction SilentlyContinue
            if($cmd){$python=$cmd.Source}
          }
          if(-not $python){throw "Python not found"}
          $env:PYTHONPATH="$env:GITHUB_WORKSPACE\02_VOICE_ENGINE\src"
          @'
          from magasin_voice_engine.supervisor_status import RobotStatus, SupervisorStateStore
          store = SupervisorStateStore()
          state = store.load()
          if state.updated_at is None:
              store.publish(
                  RobotStatus.IDLE,
                  current_step="waiting_for_job",
                  next_action="Keep the GitHub runner online and wait for a job.",
                  requires_user=False,
                  message="Supervisor controls installed.",
              )
          else:
              store.ensure_dashboard()
          print(store.dashboard_path)
          '@ | & $python -
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Install START STOP and SAYDI CONTROL on Desktop
        shell: powershell
        run: |
          $controlDir=Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\control"
          $statusDir=Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydi"
          $dashboard=Join-Path $statusDir "saydi_status.html"
          $desktop=[Environment]::GetFolderPath("Desktop")
          if(-not $desktop){throw "Desktop path unavailable"}
          New-Item -ItemType Directory -Force -Path $controlDir | Out-Null

          $runnerCmd=@'
          @echo off
          title MAGASIN-PC GitHub Runner
          cd /d C:\actions-runner
          echo ============================================================
          echo  MAGASIN-PC RUNNER
          echo  Keep this window open while the robot should receive jobs.
          echo ============================================================
          echo.
          call run.cmd
          echo.
          echo Runner stopped. Press any key to close.
          pause >nul
          '@
          Set-Content -Path (Join-Path $controlDir "RUN_MAGASIN_RUNNER.cmd") -Value $runnerCmd -Encoding ASCII

          $startPs=@'
          $ErrorActionPreference = "Stop"
          $controlDir = Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\control"
          $dashboard = Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydi\saydi_status.html"
          $runnerRoot = "C:\actions-runner"

          if(-not (Test-Path (Join-Path $runnerRoot "run.cmd"))){
              Add-Type -AssemblyName PresentationFramework
              [System.Windows.MessageBox]::Show(
                  "C:\actions-runner\run.cmd was not found.",
                  "MAGASIN Supervisor",
                  "OK",
                  "Error"
              ) | Out-Null
              exit 2
          }

          $listener = Get-Process -Name "Runner.Listener" -ErrorAction SilentlyContinue
          if(-not $listener){
              $runnerScript = Join-Path $controlDir "RUN_MAGASIN_RUNNER.cmd"
              $arg = '/k "' + $runnerScript + '"'
              Start-Process -FilePath "cmd.exe" -ArgumentList $arg
              Start-Sleep -Seconds 4
              $listener = Get-Process -Name "Runner.Listener" -ErrorAction SilentlyContinue
          }

          if(Test-Path $dashboard){
              Start-Process -FilePath $dashboard
          }

          if($listener){
              Add-Type -AssemblyName PresentationFramework
              [System.Windows.MessageBox]::Show(
                  "MAGASIN Supervisor is ONLINE.\n\nRunner is ready to receive GitHub jobs.\nSAYDI CONTROL has been opened.",
                  "MAGASIN Supervisor",
                  "OK",
                  "Information"
              ) | Out-Null
              exit 0
          }

          Add-Type -AssemblyName PresentationFramework
          [System.Windows.MessageBox]::Show(
              "Runner did not become ONLINE.\nCheck the MAGASIN-PC GitHub Runner window for the error message.",
              "MAGASIN Supervisor",
              "OK",
              "Warning"
          ) | Out-Null
          exit 3
          '@
          Set-Content -Path (Join-Path $controlDir "Start-MagasinSupervisor.ps1") -Value $startPs -Encoding UTF8

          $stopPs=@'
          $ErrorActionPreference = "SilentlyContinue"
          $workers = Get-Process -Name "Runner.Worker" -ErrorAction SilentlyContinue
          if($workers){$workers | Stop-Process -Force}
          $listeners = Get-Process -Name "Runner.Listener" -ErrorAction SilentlyContinue
          if($listeners){$listeners | Stop-Process -Force}
          Start-Sleep -Seconds 1
          Add-Type -AssemblyName PresentationFramework
          [System.Windows.MessageBox]::Show(
              "MAGASIN Supervisor is OFFLINE.\nThe robot will not receive new GitHub jobs until START is used again.",
              "MAGASIN Supervisor",
              "OK",
              "Information"
          ) | Out-Null
          '@
          Set-Content -Path (Join-Path $controlDir "Stop-MagasinSupervisor.ps1") -Value $stopPs -Encoding UTF8

          $startCmd=@'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%LOCALAPPDATA%\MAGASIN\MediaRobot\control\Start-MagasinSupervisor.ps1"
          '@
          Set-Content -Path (Join-Path $desktop "START_MAGASIN_SUPERVISOR.cmd") -Value $startCmd -Encoding ASCII

          $stopCmd=@'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%LOCALAPPDATA%\MAGASIN\MediaRobot\control\Stop-MagasinSupervisor.ps1"
          '@
          Set-Content -Path (Join-Path $desktop "STOP_MAGASIN_SUPERVISOR.cmd") -Value $stopCmd -Encoding ASCII

          if(-not(Test-Path $dashboard)){throw "Dashboard missing: $dashboard"}
          $shortcutPath=Join-Path $desktop "SAYDI CONTROL.lnk"
          $shell=New-Object -ComObject WScript.Shell
          $shortcut=$shell.CreateShortcut($shortcutPath)
          $shortcut.TargetPath=$dashboard
          $shortcut.WorkingDirectory=$statusDir
          $shortcut.Description="SAYDI robot status and heartbeat"
          $shortcut.Save()

          Write-Host "PASS: installed START/STOP controls and SAYDI CONTROL."
          Write-Host "Desktop: $desktop"
          Write-Host "Dashboard: $dashboard"
          Write-Host "No Saydi Generate or Download operation was performed."
