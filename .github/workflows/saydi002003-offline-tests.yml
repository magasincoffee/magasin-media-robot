name: SAYDI002-003 Offline Preflight Tests

on:
  pull_request:
    paths:
      - "01_DISCOVERY/saydivoice/**"
      - ".github/workflows/saydi002003-offline-tests.yml"
  push:
    branches:
      - main
    paths:
      - "01_DISCOVERY/saydivoice/**"
      - ".github/workflows/saydi002003-offline-tests.yml"

permissions:
  contents: read

jobs:
  test-no-generate:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and PowerShell parse
        shell: powershell
        run: |
          python -m py_compile "01_DISCOVERY\saydivoice\src\saydivoice_discovery\saydi002_preflight.py"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "01_DISCOVERY\saydivoice\scripts\ci_saydi002003_preflight.ps1"),
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw "SAYDI002003_PS_SYNTAX_FAILED" }
      - name: Run synthetic no-generate tests (no browser, no credentials)
        shell: powershell
        run: |
          $env:PYTHONPATH="$PWD\01_DISCOVERY\saydivoice\src"
          python -m unittest discover -s 01_DISCOVERY\saydivoice\tests -p test_saydi002_preflight.py -v
