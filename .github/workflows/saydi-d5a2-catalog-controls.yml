name: SaydiVoice D5A2 Catalog Controls

on:
  push:
    branches:
      - d5/voice-style-readonly-20260917
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saydi-d5a2-${{ github.repository }}
  cancel-in-progress: false

jobs:
  d5a2-readonly:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: 01_DISCOVERY/saydivoice
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Resolve installed Python
        run: |
          $python=$null; $py=Get-Command py.exe -ErrorAction SilentlyContinue
          if($py){$candidate=(& $py.Source -3 -c "import sys; print(sys.executable)").Trim(); if($LASTEXITCODE -eq 0 -and (Test-Path $candidate)){$python=$candidate}}
          if(-not $python){$cmd=Get-Command python.exe -ErrorAction SilentlyContinue; if($cmd){$python=$cmd.Source}}
          if(-not $python -or -not (Test-Path $python)){throw "Installed Python 3 was not found."}
          "SAYDI_SYSTEM_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create isolated D5A2 environment
        run: |
          $venv=Join-Path $env:RUNNER_TEMP "saydi-d5a2-venv"; if(Test-Path $venv){Remove-Item $venv -Recurse -Force}
          & "$env:SAYDI_SYSTEM_PYTHON" -m venv $venv; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $vp=Join-Path $venv "Scripts\python.exe"
          & $vp -m pip install --upgrade pip; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $vp -m pip install -r requirements-dev.txt; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $vp -m pip install -e .; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          "SAYDI_PYTHON=$vp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve installed Google Chrome
        run: |
          $chrome=Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"; if(-not (Test-Path $chrome)){$chrome=Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe"}
          if(-not (Test-Path $chrome)){throw "Installed Google Chrome was not found."}
          "SAYDI_CHROME=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify profile unlocked
        run: |
          $profile=Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\browser_profile"; if(-not (Test-Path $profile)){throw "Saydi browser profile is missing."}
          $holders=@(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" | Where-Object {$_.CommandLine -like "*MAGASIN\MediaRobot\saydivoice\browser_profile*"}); if($holders.Count -gt 0){throw "Saydi robot profile is currently open in Chrome."}
      - name: Run D5A2 full catalog and controls probe
        run: |
          & "$env:SAYDI_PYTHON" -m saydivoice_discovery.d5_catalog_pages --chromium-executable "$env:SAYDI_CHROME"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Collect evidence
        if: always()
        run: |
          $root=Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\runs\d5a2_catalog_controls_latest"; $out=Join-Path $env:RUNNER_TEMP "saydi-d5a2-evidence"
          if(Test-Path $out){Remove-Item $out -Recurse -Force}; New-Item -ItemType Directory -Path $out | Out-Null
          if(Test-Path $root){Get-ChildItem $root -File | Where-Object {$_.Extension -in @('.json','.png')} | ForEach-Object {Copy-Item $_.FullName $out -Force}}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saydi-d5a2-${{ github.run_id }}
          path: ${{ runner.temp }}\saydi-d5a2-evidence
          if-no-files-found: warn
          retention-days: 7
