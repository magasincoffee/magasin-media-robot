[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magasin-voice-engine"
version = "0.1.0"
description = "Provider-neutral voice engine for MAGASIN Media Robot"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.57.0",
]

[project.scripts]
magasin-saydi-status = "magasin_voice_engine.supervisor_status:_main"

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
