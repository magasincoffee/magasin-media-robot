name: SaydiVoice D5A3 Controls Probe

on:
  push:
    branches:
      - d5/voice-style-discovery-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls-probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
        working-directory: 01_DISCOVERY/saydivoice
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Python
        run: |
          $python=$null; $py=Get-Command py.exe -ErrorAction SilentlyContinue
          if($py){$candidate=(& $py.Source -3 -c "import sys; print(sys.executable)").Trim(); if($LASTEXITCODE -eq 0 -and (Test-Path $candidate)){$python=$candidate}}
          if(-not $python){$cmd=Get-Command python.exe -ErrorAction SilentlyContinue; if($cmd){$python=$cmd.Source}}
          if(-not $python){throw "Python not found"}
          "SAYDI_SYSTEM_PYTHON=$python" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build environment
        run: |
          $v=Join-Path $env:RUNNER_TEMP "saydi-d5a3-venv"; if(Test-Path $v){Remove-Item $v -Recurse -Force}
          & "$env:SAYDI_SYSTEM_PYTHON" -m venv $v
          $p=Join-Path $v "Scripts\python.exe"; & $p -m pip install -q -r requirements.txt; & $p -m pip install -q -e .
          "SAYDI_PYTHON=$p" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve Chrome and profile
        run: |
          $chrome=Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"; if(-not(Test-Path $chrome)){$chrome=Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe"}; if(-not(Test-Path $chrome)){throw "Chrome not found"}
          $profile=Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\browser_profile"; if(-not(Test-Path $profile)){throw "Profile missing"}
          $holders=@(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" | Where-Object {$_.CommandLine -like "*MAGASIN\MediaRobot\saydivoice\browser_profile*"}); if($holders.Count -gt 0){throw "Profile locked"}
          "SAYDI_CHROME=$chrome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run read-only control DOM probe
        run: |
          & "$env:SAYDI_PYTHON" -m saydivoice_discovery.d5_controls_probe --chromium-executable "$env:SAYDI_CHROME"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Stage evidence
        if: always()
        run: |
          $src=Join-Path $env:LOCALAPPDATA "MAGASIN\MediaRobot\saydivoice\runs\d5a3_latest"; $out=Join-Path $env:RUNNER_TEMP "saydi-d5a3-evidence"; if(Test-Path $out){Remove-Item $out -Recurse -Force}; New-Item -ItemType Directory -Path $out | Out-Null; if(Test-Path $src){Copy-Item "$src\*" $out -Force}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saydi-d5a3-${{ github.run_id }}
          path: ${{ runner.temp }}\saydi-d5a3-evidence
          retention-days: 7
