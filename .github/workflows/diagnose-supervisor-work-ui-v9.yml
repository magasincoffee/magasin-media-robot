name: Diagnose Supervisor Work UI V9

on:
  push:
    branches:
      - ops/diagnose-supervisor-work-ui-v9
    paths:
      - '.github/workflows/diagnose-supervisor-work-ui-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    defaults:
      run:
        shell: powershell

    steps:
      - name: Sample privacy-safe ChatGPT UI state
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $runtime = Join-Path $root 'runtime'
          $profile = Join-Path $root 'browser_profile'
          $port = $null

          foreach ($candidate in 9222..9232) {
            $listener = Get-NetTCPConnection -State Listen -LocalPort $candidate -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $listener) { continue }
            $owner = Get-CimInstance Win32_Process -Filter "ProcessId=$($listener.OwningProcess)" -ErrorAction SilentlyContinue
            if (
              $owner -and
              $owner.Name -eq 'chrome.exe' -and
              $owner.CommandLine -and
              $owner.CommandLine -like "*$profile*"
            ) {
              $port = $candidate
              break
            }
          }

          if (-not $port) { throw 'Dedicated Supervisor CDP port not found.' }

          $env:MAGASIN_RUNTIME = $runtime
          $env:MAGASIN_CDP = "http://127.0.0.1:$port"

          $script = @'
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          import { setTimeout as delay } from "node:timers/promises";

          const runtime = process.env.MAGASIN_RUNTIME;
          const cdp = process.env.MAGASIN_CDP;

          const { ChatGptUiAdapter } = await import(
            pathToFileURL(path.join(runtime, "src", "ui", "playwright-adapter.mjs")).href
          );

          const adapter = new ChatGptUiAdapter({
            cdpUrl: cdp,
            settleMs: 0,
            timeoutMs: 15000
          });
          await adapter.open();

          const page = adapter.getActivePage();
          if (!page) throw new Error("No active ChatGPT page found.");

          let pathName = "invalid";
          try { pathName = new URL(page.url()).pathname; } catch {}
          console.log("ACTIVE_CHAT_PATH=" + pathName);

          for (let i = 0; i < 9; i += 1) {
            const result = await adapter.probe();
            const s = result.snapshot;
            const cls = result.classification;
            console.log("SAMPLE_" + i + "=" + JSON.stringify({
              pathKind: s.pathKind,
              composerReady: s.composerReady,
              assistantMessageCount: s.assistantMessageCount,
              userMessageCount: s.userMessageCount,
              lastMessageRole: s.lastMessageRole,
              lastMessageCharCount: s.lastMessageCharCount,
              lastAssistantCharCount: s.lastAssistantCharCount,
              mainBusy: s.mainBusy,
              mainTextCharCount: s.mainTextCharCount,
              mainElementCount: s.mainElementCount,
              responseRunning: s.responseRunning,
              hasTransientError: s.hasTransientError,
              uiState: cls.uiState,
              observation: cls.observation
            }));
            await delay(5000);
          }

          await adapter.close();
          process.exit(0);
          '@

          $diag = Join-Path $env:RUNNER_TEMP 'magasin-work-ui-v9-diag.mjs'
          Set-Content -Path $diag -Value $script -Encoding UTF8
          node $diag
