[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magasin-saydivoice-discovery"
version = "0.4.0"
description = "SaydiVoice browser discovery runner for MAGASIN Media Robot"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.57.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[project.scripts]
magasin-saydi-discovery = "saydivoice_discovery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"
}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
