name: Repair Supervisor Work Handoff V8

on:
  push:
    branches:
      - ops/repair-supervisor-work-handoff-v8
    paths:
      - '.github/workflows/repair-supervisor-work-handoff-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-supervisor-work-handoff-v8
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell

    steps:
      - name: Fetch latest canonical Business OS
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'magasin-business-os-v8'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          git clone --depth 1 https://github.com/magasincoffee/magasincoffee.github.io.git $dest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUSINESS_OS_REPO=$dest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $state = Get-Content (Join-Path $dest '01_DOCS\MAGASIN\00_PROJECT_STATE.json') -Raw | ConvertFrom-Json
          Write-Host "CANONICAL_TASK=$($state.current_task) - $($state.current_task_title)"
          Write-Host "CANONICAL_STATUS=$($state.status)"
          Write-Host "CANONICAL_AUTONOMY=$($state.autonomy)"

      - name: Repair and boot Supervisor 2026-09-18.8
        run: |
          $repair = Join-Path $env:BUSINESS_OS_REPO '08_INTEGRATIONS\supervisor\windows\repair-supervisor.ps1'
          if (-not (Test-Path $repair)) { throw "Repair script missing: $repair" }

          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $repair -SkipGitPull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed runtime fingerprint
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $runtime = Join-Path $root 'runtime'
          $loop = Join-Path $runtime 'src\runtime\supervisor-loop-cli.mjs'
          $controller = Join-Path $runtime 'src\runtime\loop.mjs'

          if (-not (Select-String -Path $loop -SimpleMatch '2026-09-18.8' -Quiet)) {
            throw 'Installed loop is not runtime 2026-09-18.8.'
          }
          if (-not (Select-String -Path $controller -SimpleMatch 'handoffIdleConfirmMs = 20_000' -Quiet)) {
            throw 'Installed controller is missing bounded Work UI handoff idle confirmation.'
          }
          if (-not (Select-String -Path $controller -SimpleMatch 'HANDOFF_IDLE_CONFIRMED' -Quiet)) {
            throw 'Installed controller is missing HANDOFF_IDLE_CONFIRMED telemetry.'
          }

          Write-Host 'RUNTIME_V8_FINGERPRINT=PASS'

      - name: Wait for bounded conversation-aware handoff
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $log = Join-Path $root 'supervisor.log'
          $statusFile = Join-Path $root 'runtime-status.json'

          $bootLine = $null
          if (Test-Path $log) {
            $bootLine = Get-Content $log -Tail 120 -Encoding UTF8 |
              Where-Object { $_ -match '"type":"RUNTIME_BOOT"' -and $_ -match 'version=2026-09-18.8' } |
              Select-Object -Last 1
          }
          if (-not $bootLine) { throw 'Runtime v8 boot marker not found.' }

          $boot = $bootLine | ConvertFrom-Json
          $bootAt = [DateTimeOffset]::Parse($boot.timestamp)

          $reconciled = $false
          $idleConfirmed = $false
          $lastStatus = $null

          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep -Seconds 5

            if (Test-Path $log) {
              $events = @(
                Get-Content $log -Tail 160 -Encoding UTF8 |
                  ForEach-Object {
                    try { $_ | ConvertFrom-Json } catch { $null }
                  } |
                  Where-Object {
                    $_ -and
                    ([DateTimeOffset]::Parse($_.timestamp) -ge $bootAt)
                  }
              )

              if ($events | Where-Object { $_.type -eq 'HANDOFF_IDLE_CONFIRMED' }) {
                $idleConfirmed = $true
              }
              if ($events | Where-Object { $_.type -eq 'HANDOFF_RECONCILED' -and $_.executed -eq $true }) {
                $reconciled = $true
                break
              }
            }

            if (Test-Path $statusFile) {
              try {
                $lastStatus = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
                Write-Host ("WAIT_STATUS=" + $lastStatus.status +
                  " action=" + $lastStatus.action +
                  " ui=" + $lastStatus.ui_state +
                  " obs=" + $lastStatus.observation)
              } catch {}
            }
          }

          Write-Host "HANDOFF_IDLE_CONFIRMED=$idleConfirmed"
          Write-Host "HANDOFF_RECONCILED=$reconciled"

          if (-not $reconciled) {
            Write-Host 'SAFE_LOG_TAIL_BEGIN'
            if (Test-Path $log) {
              Get-Content $log -Tail 30 -Encoding UTF8 | ForEach-Object { Write-Host $_ }
            }
            Write-Host 'SAFE_LOG_TAIL_END'
            throw 'Supervisor did not complete the one-time handoff reconciliation within 120 seconds.'
          }

      - name: Verify no duplicate Supervisor loops
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'

          $wrappers = @(
            Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -and
                $_.CommandLine -like '*run-supervisor.ps1*' -and
                $_.CommandLine -like "*$root*"
              }
          )
          $nodes = @(
            Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like '*supervisor-loop-cli.mjs*' }
          )

          Write-Host "WRAPPER_COUNT=$($wrappers.Count)"
          Write-Host "NODE_LOOP_COUNT=$($nodes.Count)"

          if ($wrappers.Count -ne 1 -or $nodes.Count -ne 1) {
            throw "Supervisor singleton failed: wrappers=$($wrappers.Count), nodes=$($nodes.Count)"
          }

          Write-Host 'FIELD_VERIFICATION=PASS'
